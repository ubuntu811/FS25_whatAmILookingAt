name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip

      - name: Build + validate mod
        run: bash build/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FS25_whatAmILookingAt
          path: build/FS25_whatAmILookingAt.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/FS25_whatAmILookingAt.zip
